name: Test
on:
  push:
    paths:
      - '**/*.go'
      - '.github/workflows/test.yaml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go:
          - "1.25"
          - "1.26"
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # BQSINK_TEST_PROJECT / BQSINK_TEST_BUCKET are deliberately unset, so the
      # integration tests skip themselves and this job never reaches BigQuery.
      - name: Build & Test
        run: |
          go test -race ./...
